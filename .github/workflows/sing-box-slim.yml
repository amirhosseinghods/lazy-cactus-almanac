name: sing-box slim image

# Builds the trimmed sing-box image that V2Ray clients run in on the router
# (docker/sing-box-slim). Runs only on purpose — manually, or by pushing a
# sing-box-slim-v<version> tag — since publishing a new tag changes what newly
# created V2Ray clients pull.
on:
  push:
    tags:
      - 'sing-box-slim-v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'sing-box version to build (without the leading v)'
        required: true
        default: '1.14.3'

permissions:
  contents: read
  packages: write

concurrency:
  group: sing-box-slim-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/sing-box-slim
  VERSION: ${{ inputs.version || github.ref_name }}

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6

      - name: Resolve sing-box version
        run: echo "VERSION=${VERSION#sing-box-slim-v}" >> "$GITHUB_ENV"

      - uses: docker/setup-qemu-action@v4

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v7
        with:
          context: docker/sing-box-slim
          platforms: linux/amd64,linux/arm64,linux/arm/v7
          push: true
          provenance: false
          sbom: false
          tags: ${{ env.IMAGE }}:${{ env.VERSION }}
          build-args: |
            SING_BOX_VERSION=${{ env.VERSION }}
          cache-from: type=gha,scope=sing-box-slim
          cache-to: type=gha,mode=max,scope=sing-box-slim

      # The point of this image is to fit on 128MB-flash routers; fail loudly
      # if a sing-box upgrade blows the budget.
      - name: Enforce 20MB per-platform size budget
        run: |
          set -euo pipefail
          REF="$IMAGE:$VERSION"
          for digest in $(docker buildx imagetools inspect "$REF" --raw | jq -r '.manifests[].digest'); do
            SIZE_BYTES=$(docker buildx imagetools inspect "$REF@$digest" --raw | jq '[.layers[].size] | add')
            SIZE_MB=$(awk "BEGIN { printf \"%.2f\", $SIZE_BYTES / 1048576 }")
            echo "$digest: ${SIZE_MB} MB"
            echo "- \`$digest\`: **${SIZE_MB} MB**" >> "$GITHUB_STEP_SUMMARY"
            if awk -v s="$SIZE_MB" 'BEGIN { exit !(s+0 > 20) }'; then
              echo "::error::Image exceeds 20MB budget (${SIZE_MB} MB)"
              exit 1
            fi
          done
